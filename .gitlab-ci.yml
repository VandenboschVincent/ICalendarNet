stages:
  - test
  - publish
  - deploy

image: mcr.microsoft.com/dotnet/sdk:10.0

before_script:
  - dotnet --version
  - dotnet tool install --global dotnet-sonarscanner
  - export PATH=\"$PATH:$HOME/.dotnet/tools\"

test:
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
      - dotnet sonarscanner begin /k:"vandenbosch_vincent_icalendarnet" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST_URL" /o:"vandenbosch-vincent" /d:sonar.cs.opencover.reportsPaths="**/TestResults/*/*.xml"
      - dotnet build
      - dotnet test --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  only:
    - merge_requests
    - master
    - main
    - develop

publish:
  stage: publish
  script:
    - dotnet publish $PROJECT_PATH -f net10.0 --configuration Release --output $PUBLISH_DIR
  only:
    - none

deploy:
  stage: deploy
  only:
    - master
    - main
    - develop
  script:
    - echo "Deploying to server..."
    - TODO!!
