stages:
  - test
  - publish
  - deploy

variables:
  PROJECT_PATH: "ICalendarNet/ICalendarNet.csproj"
  TEST_PROJECT_PATH: "ICalendarNet.UnitTest/bin/Debug/net10.0/ICalendarNet.UnitTest.dll"
  PUBLISH_DIR: "publish"

image: mcr.microsoft.com/dotnet/sdk:10.0

before_script:
  - dotnet --version

test:
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
      - apt-get update
      - apt-get install --yes openjdk-17-jre
      - dotnet tool install --global dotnet-sonarscanner
      - dotnet tool install --global coverlet.console
      - export PATH=\"$PATH:$HOME/.dotnet/tools\"
      - dotnet sonarscanner begin /k:"vandenbosch_vincent_icalendarnet" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST_URL" /o:"vandenbosch-vincent"
      - dotnet build
      - coverlet $TEST_PROJECT_PATH --target "dotnet"  --targetargs "test --no-build" -f=opencover -o="coverage.xml"
      - dotnet-coverage collect "dotnet test" -f xml -o "coverage.xml"
      - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

publish:
  stage: publish
  script:
    - dotnet publish $PROJECT_PATH -f net10.0 --configuration Release --output $PUBLISH_DIR

deploy:
  stage: deploy
  only:
    - master
    - main
    - develop
  script:
    - echo "Deploying to server..."
    - TODO!!
