stages:
  - build
  - test
  - publish
  - deploy

variables:
  PROJECT_PATH: "ICalendarNet/ICalendarNet.csproj"
  TEST_PROJECT_PATH: "ICalendarNet.UnitTest/ICalendarNet.UnitTest.csproj"
  PUBLISH_DIR: "publish"

image: mcr.microsoft.com/dotnet/sdk:10.0

before_script:
  - dotnet --version
  - dotnet tool install --global dotnet-sonarscanner
  - dotnet sonarscanner begin /k:"vandenbosch_vincent_icalendarnet" /d:sonar.token="$SONAR_TOKEN"

build:
  stage: build
  script:
    - dotnet build $PROJECT_PATH --configuration Release
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

test:
  stage: test
  script:
    - dotnet test $PROJECT_PATH --verbosity normal

publish:
  stage: publish
  script:
    - dotnet publish $PROJECT_PATH -f net10.0 --configuration Release --output $PUBLISH_DIR

deploy:
  stage: deploy
  only:
    - develop
  script:
    - echo "Deploying to server..."
    - TODO!!
